[project]
name = "cis6930sp26-project"
version = "0.1.0"
description = "Schema-constrained LLM pipeline for travel risk assessment stability analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.4.0",
    "openai>=1.0.0",
    "jsonschema>=4.23.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
